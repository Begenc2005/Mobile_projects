limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
server { listen 80; server_name _; return 301 https://$host$request_uri; }
server {
  listen 443 ssl http2;
  server_name bilim.tm;                 # replace with your domain
  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  gzip on; gzip_types application/json;
  client_max_body_size 1m;
  location /api/auth/ { limit_req zone=auth burst=3; proxy_pass http://api:8000; }
  location / { proxy_pass http://api:8000; proxy_set_header X-Real-IP $remote_addr; }
}

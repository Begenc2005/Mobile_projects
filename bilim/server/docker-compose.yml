# Run from the project root:  docker compose -f server/docker-compose.yml up -d --build
services:
  api:
    build: { context: .., dockerfile: server/Dockerfile }
    restart: always
    env_file: .env
    volumes: [ "bilim-data:/data" ]
  nginx:
    image: nginx:alpine
    restart: always
    ports: [ "80:80", "443:443" ]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [ api ]
volumes:
  bilim-data:

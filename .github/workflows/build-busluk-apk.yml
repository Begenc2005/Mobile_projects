name: Build Busluk APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["busluk/android/**", ".github/workflows/build-busluk-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: busluk/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Create debug keystore (so the release APK is installable)
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign release with debug key
        run: sed -i 's#proguardFiles(#signingConfig = signingConfigs.getByName("debug")\n            proguardFiles(#' app/build.gradle.kts

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || { grep -E -i 'error|failed|what went wrong|\.kt:[0-9]+|\.xml:[0-9]+' build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: busluk-latest
          name: Busluk APK
          files: busluk/android/app/build/outputs/apk/release/app-release.apk
          make_latest: false

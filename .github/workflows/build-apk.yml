name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "API URL (server address)"
        default: "https://api.sargyt.tm"
  push:
    branches: [main, master]
    paths: ["sargyt/app/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sargyt/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android/ios folders + permissions
        run: bash setup_platforms.sh

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=API_URL=${{ github.event.inputs.api_url || 'https://api.sargyt.tm' }} 2>&1 | tee build.log || { grep -E -i 'error|failed|what went wrong|\.dart:[0-9]+' build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: sargyt-apk
          path: sargyt/app/build/app/outputs/flutter-apk/app-*-release.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sargyt-latest
          name: SARGYT APK
          files: sargyt/app/build/app/outputs/flutter-apk/app-*-release.apk
          make_latest: false

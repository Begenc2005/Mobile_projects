name: Build DEMO APKs

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/build-demo.yml"]

permissions:
  contents: write

jobs:
  sargyt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sargyt/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare platforms
        run: |
          bash setup_platforms.sh
      - name: Build DEMO APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=DEMO=true 2>&1 | tee build.log || { grep -E -i 'error|failed|what went wrong|\.dart:[0-9]+' build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          mkdir -p ../../out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../out/sargyt-demo.apk
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sargyt-demo
          name: SARGYT DEMO APK
          files: out/sargyt-demo.apk
          make_latest: false

  bilim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bilim/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare platforms
        run: |
          flutter create . --platforms=android,ios --org tm.bilim --project-name bilim
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="bilim"#android:label="Bilim"#' $M
          flutter pub get
          dart run flutter_launcher_icons
      - name: Build DEMO APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=DEMO=true 2>&1 | tee build.log || { grep -E -i 'error|failed|what went wrong|\.dart:[0-9]+' build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          mkdir -p ../../out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../out/bilim-demo.apk
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bilim-demo
          name: Bilim DEMO APK
          files: out/bilim-demo.apk
          make_latest: false

  dost:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dost/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare platforms
        run: |
          flutter create --org tm.dost --project-name dost --platforms android,ios .
          python3 tool/setup_platforms.py
          flutter pub get
      - name: Build DEMO APK
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=DEMO=true 2>&1 | tee build.log || { grep -E -i 'error|failed|what went wrong|\.dart:[0-9]+' build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          mkdir -p ../../out && cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../../out/dost-demo.apk
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dost-demo
          name: Dost DEMO APK
          files: out/dost-demo.apk
          make_latest: false
